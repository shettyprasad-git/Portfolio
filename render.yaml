services:
  - type: web
    name: flowpilot-ai-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: HuggingFaceH4/zephyr-7b-beta
